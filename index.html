<style>
:root{--bg:#F2F7FF;--card:#fff;--ink:#1E2A45;--muted:#5F6B85;--line:#DCE5F2;--go:#22B573;--god:#168A55}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:600 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}

#err{color:#D9432F;font-size:14px;min-height:20px}

async function open(key){ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)); const h=new TextDecoder().decode(pt); document.open(); document.write(h); document.close(); }
async function fromSaved(){ try{ const k=localStorage.getItem('rq-key'); if(!k) return false; const key=await crypto.subtle.importKey('raw',u(k),'AES-GCM',true,['decrypt']); await open(key); return true; }catch(e){ try{localStorage.removeItem('rq-key')}catch(_){} return false; } }

(async()=>{ if(await fromSaved()) return; document.getElementById('f').hidden=false; document.getElementById('pw').focus(); })();
document.getElementById('f').addEventListener('submit',async e=>{ e.preventDefault(); const err=document.getElementById('err'), b=document.getElementById('go'); err.textContent=''; b.textContent='Unlocking…'; b.disabled=true;
  try{ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
    await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
    if(document.getElementById('rem').checked){ try{ localStorage.setItem('rq-key',btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(key);
  }catch(x){ err.textContent='Wrong password. Try again.'; b.textContent='Unlock'; b.disabled=false; }
